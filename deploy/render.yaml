# Render blueprint for WonderFleet (Ofemini Global Limited).
# Secrets marked sync:false are entered once in the Render dashboard.
services:
  - type: web
    name: wonderfleet-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    disk:
      name: wonderfleet-uploads
      mountPath: /var/data/wonderfleet
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        fromDatabase:
          name: wonderfleet-db
          property: connectionString
      - key: Database__SslMode
        value: Require
      - key: Storage__RootPath
        value: /var/data/wonderfleet
      - key: App__PublicApiBaseUrl
        fromService:
          type: web
          name: wonderfleet-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: App__FrontendBaseUrl
        value: https://wonderfleet.onrender.com
      - key: App__AllowedOrigins__0
        value: https://wonderfleet.onrender.com
      # --- secrets (generate once, then keep) -------------------------------
      - key: Jwt__AdminSigningKey
        generateValue: true
      - key: Jwt__PortalSigningKey
        generateValue: true
      - key: Security__TokenHashKey
        generateValue: true
      - key: Security__MediaSigningKey
        generateValue: true
      - key: Seed__AdminPassword
        sync: false
      # --- integrations -----------------------------------------------------
      - key: Firebase__DatabaseUrl
        value: https://wonderfleet-12693-default-rtdb.europe-west1.firebasedatabase.app
      - key: Firebase__ServiceAccountJson
        sync: false
      - key: Google__ApiKey
        sync: false
      - key: OpenAi__ApiKey
        sync: false
      - key: Email__Provider
        value: ResendApi
      - key: Email__ApiKey
        sync: false
      - key: Email__From
        value: WonderFleet <alerts@ofeminiagrictech.com>
      - key: Sms__Provider
        value: Termii
      - key: Sms__Termii__ApiKey
        sync: false
      - key: Sms__Termii__SenderId
        value: WonderFleet
      - key: Telemetry__WebhookSecret
        sync: false

  - type: web
    name: wonderfleet
    runtime: static
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://wonderfleet-api.onrender.com
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  - name: wonderfleet-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
