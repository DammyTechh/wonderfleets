# Local stack: PostgreSQL 16 plus the API.
#
# Host ports are deliberately NOT the defaults, because most machines already have
# something on 5432. Override them in .env if these clash too:
#   DB_PORT=5433      -> postgres on the host
#   API_PORT=8080     -> the API on the host
# Inside the compose network the API always reaches postgres on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wonderfleet
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: ["wonderfleet-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wonderfleet"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    # .env lives at the repository root (cp deploy/.env.example .env)
    env_file: [../.env]
    environment:
      # Container-to-container: service name "db", internal port 5432.
      # This overrides whatever ConnectionStrings__Default is in .env, which points
      # at the host port and is meant for `dotnet run` outside Docker.
      ConnectionStrings__Default: Host=db;Port=5432;Database=wonderfleet;Username=postgres;Password=postgres
      Storage__RootPath: /var/data/wonderfleet
    ports: ["${API_PORT:-8080}:8080"]
    volumes: ["wonderfleet-uploads:/var/data/wonderfleet"]

volumes:
  wonderfleet-db:
  wonderfleet-uploads:
