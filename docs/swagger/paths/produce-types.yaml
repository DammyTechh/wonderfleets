paths:
  /produce-types:
    get:
      tags:
      - Produce
      summary: List produce types
      responses:
        '400': &id001
          $ref: ./../components/responses.yaml#/components/responses/BadRequest
        '401': &id002
          $ref: ./../components/responses.yaml#/components/responses/Unauthorized
        '403': &id003
          $ref: ./../components/responses.yaml#/components/responses/Forbidden
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./../components/schemas.yaml#/components/schemas/ProduceType
      operationId: listProduceTypes
    post:
      tags:
      - Produce
      summary: Add a produce type
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/IdResponse
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
      operationId: createProduceType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/ProduceTypeRequest
  /produce-types/{id}:
    put:
      tags:
      - Produce
      summary: Update a produce type
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/ProduceType
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
      operationId: updateProduceType
      parameters:
      - $ref: ./../components/responses.yaml#/components/parameters/id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/ProduceTypeRequest
