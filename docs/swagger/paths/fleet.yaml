paths:
  /fleet:
    get:
      tags:
      - Fleet management
      summary: List the fleet
      responses:
        '400': &id001
          $ref: ./../components/responses.yaml#/components/responses/BadRequest
        '401': &id002
          $ref: ./../components/responses.yaml#/components/responses/Unauthorized
        '403': &id003
          $ref: ./../components/responses.yaml#/components/responses/Forbidden
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/PagedFleetRows
      operationId: listFleet
      description: One row per vehicle with its current shipment, driver, route and live climate readings.
      parameters:
      - $ref: ./../components/responses.yaml#/components/parameters/page
      - $ref: ./../components/responses.yaml#/components/parameters/pageSize
      - $ref: ./../components/responses.yaml#/components/parameters/search
      - name: partnerId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - Normal
          - Warning
          - Critical
          - Offline
        description: Live sensor status of the current shipment.
      - name: tripStatus
        in: query
        schema:
          type: string
          enum:
          - Scheduled
          - InTransit
          - Stopped
          - Delayed
          - Completed
          - Cancelled
    post:
      tags:
      - Fleet management
      summary: Add a fleet (wizard submit)
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/FleetCreated
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./../components/responses.yaml#/components/responses/UnprocessableEntity
      operationId: createFleet
      description: Registers a vehicle (or reuses one), creates the shipment, assigns the driver and device, stores the temperature
        and humidity limits and pushes them to the device. Set `startImmediately` to dispatch at once; otherwise the trip
        is scheduled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/CreateFleetRequest
  /fleet/next-vehicle-code:
    get:
      tags:
      - Fleet management
      summary: Preview the next vehicle code
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicleCode:
                    type: string
                    example: TRK-1288
      operationId: nextVehicleCode
      description: Shows the auto-generated code (for example TRK-1288) on the first wizard tab. The definitive code is assigned
        when the wizard is submitted.
  /fleet/suggested-thresholds:
    get:
      tags:
      - Fleet management
      summary: Suggest temperature and humidity limits
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/SuggestedThresholds
      operationId: suggestThresholds
      description: 'Intersects the safe ranges of the selected produce so every item stays safe. `source: conflict` means
        the produce cannot travel together.'
      parameters:
      - name: produceTypeId
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Repeat for each selected produce.
  /fleet/vehicles/{vehicleId}:
    get:
      tags:
      - Fleet management
      summary: Vehicle detail
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: getVehicle
      description: Devices, current shipment and recent history.
      parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
      - Fleet management
      summary: Update a vehicle
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./../components/responses.yaml#/components/responses/UnprocessableEntity
      operationId: updateVehicle
      parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/VehicleInput
    delete:
      tags:
      - Fleet management
      summary: Retire a vehicle
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ./../components/responses.yaml#/components/responses/UnprocessableEntity
      operationId: deleteVehicle
      description: Soft delete; blocked while a shipment is in progress.
      parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
