paths:
  /agro-processors:
    get:
      tags:
      - Agro-processors
      summary: List agro-processors
      responses:
        '400': &id001
          $ref: ./../components/responses.yaml#/components/responses/BadRequest
        '401': &id002
          $ref: ./../components/responses.yaml#/components/responses/Unauthorized
        '403': &id003
          $ref: ./../components/responses.yaml#/components/responses/Forbidden
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/PagedProcessors
      operationId: listProcessors
      parameters:
      - $ref: ./../components/responses.yaml#/components/parameters/page
      - $ref: ./../components/responses.yaml#/components/parameters/pageSize
      - $ref: ./../components/responses.yaml#/components/parameters/search
      - &id004
        name: status
        in: query
        schema:
          type: string
          enum:
          - Pending
          - Active
          - Suspended
    post:
      tags:
      - Agro-processors
      summary: Add an agro-processor
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/IdResponse
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
      operationId: createProcessor
      description: The facility address is GPS-referenced and at least one contact person is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/AgroProcessorRequest
  /agro-processors/export:
    get:
      tags:
      - Agro-processors
      summary: Export agro-processors as CSV
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          $ref: ./../components/responses.yaml#/components/responses/FileDownload
      operationId: exportProcessors
      parameters:
      - *id004
      - $ref: ./../components/responses.yaml#/components/parameters/search
  /agro-processors/{id}:
    get:
      tags:
      - Agro-processors
      summary: Agro-processor detail
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: getProcessor
      parameters: &id005
      - $ref: ./../components/responses.yaml#/components/parameters/id
    put:
      tags:
      - Agro-processors
      summary: Update an agro-processor
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
      operationId: updateProcessor
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/AgroProcessorRequest
    delete:
      tags:
      - Agro-processors
      summary: Remove an agro-processor
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ./../components/responses.yaml#/components/responses/UnprocessableEntity
      operationId: deleteProcessor
      parameters: *id005
  /agro-processors/{id}/status:
    post:
      tags:
      - Agro-processors
      summary: Change the status
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: changeProcessorStatus
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/ChangePartnerStatusRequest
  /agro-processors/{id}/photo:
    post:
      tags:
      - Agro-processors
      summary: Upload the processor logo
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoUrl:
                    type: string
                    nullable: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: uploadProcessorPhoto
      parameters: *id005
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
