paths:
  /logistics-partners:
    get:
      tags:
      - Logistics partners
      summary: List logistics partners
      responses:
        '400': &id001
          $ref: ./../components/responses.yaml#/components/responses/BadRequest
        '401': &id002
          $ref: ./../components/responses.yaml#/components/responses/Unauthorized
        '403': &id003
          $ref: ./../components/responses.yaml#/components/responses/Forbidden
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/PagedPartners
      operationId: listPartners
      parameters:
      - $ref: ./../components/responses.yaml#/components/parameters/page
      - $ref: ./../components/responses.yaml#/components/parameters/pageSize
      - $ref: ./../components/responses.yaml#/components/parameters/search
      - &id004
        name: status
        in: query
        schema:
          type: string
          enum:
          - Pending
          - Active
          - Suspended
    post:
      tags:
      - Logistics partners
      summary: Onboard a logistics partner
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/IdResponse
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
      operationId: createPartner
      description: Company info, fleet details, operations and compliance in one request. The partner starts as Pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/LogisticsPartnerRequest
  /logistics-partners/export:
    get:
      tags:
      - Logistics partners
      summary: Export partners as CSV
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          $ref: ./../components/responses.yaml#/components/responses/FileDownload
      operationId: exportPartners
      parameters:
      - *id004
      - $ref: ./../components/responses.yaml#/components/parameters/search
  /logistics-partners/{id}:
    get:
      tags:
      - Logistics partners
      summary: Partner profile
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: getPartner
      description: Fleet size, completed trips, active shipments, corridors, compliance documents, driver pool, fleet composition
        and recent shipments.
      parameters: &id005
      - &id006
        $ref: ./../components/responses.yaml#/components/parameters/id
    put:
      tags:
      - Logistics partners
      summary: Update a partner
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
      operationId: updatePartner
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/LogisticsPartnerRequest
    delete:
      tags:
      - Logistics partners
      summary: Remove a partner
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ./../components/responses.yaml#/components/responses/UnprocessableEntity
      operationId: deletePartner
      description: Soft delete. Live tracking links are revoked; blocked while shipments are in progress.
      parameters: *id005
  /logistics-partners/{id}/status:
    post:
      tags:
      - Logistics partners
      summary: Activate, suspend or re-pend a partner
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: changePartnerStatus
      description: Suspending revokes every live tracking link for that partner and emails the contact person.
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/ChangePartnerStatusRequest
  /logistics-partners/{id}/photo:
    post:
      tags:
      - Logistics partners
      summary: Upload the partner logo
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoUrl:
                    type: string
                    nullable: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: uploadPartnerPhoto
      parameters: *id005
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /logistics-partners/{id}/documents:
    post:
      tags:
      - Logistics partners
      summary: Upload a compliance document
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: uploadPartnerDocument
      description: CAC certificate, insurance certificate or an operating licence. PDF, PNG or JPG up to 10 MB.
      parameters:
      - $ref: ./../components/responses.yaml#/components/parameters/id
      - name: documentType
        in: query
        required: true
        description: Document type.
        schema:
          type: string
          enum:
          - CacCertificate
          - InsurancePolicy
          - RegisteredDrivers
          - VehicleLicense
          - Other
      - name: expiresOn
        in: query
        required: false
        description: Expiry date, where the document has one.
        schema:
          type: string
          format: date
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /logistics-partners/{id}/documents/{documentId}:
    delete:
      tags:
      - Logistics partners
      summary: Delete a document
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: deletePartnerDocument
      parameters:
      - *id006
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /logistics-partners/{id}/documents/{documentId}/verify:
    post:
      tags:
      - Logistics partners
      summary: Verify or un-verify a document
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: verifyPartnerDocument
      parameters:
      - *id006
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - isVerified
              properties:
                isVerified:
                  type: boolean
                expiresOn:
                  type: string
                  format: date
                  nullable: true
  /logistics-partners/{id}/documents/{documentId}/download:
    get:
      tags:
      - Logistics partners
      summary: Download a document
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          $ref: ./../components/responses.yaml#/components/responses/FileDownload
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: downloadPartnerDocument
      parameters:
      - *id006
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
