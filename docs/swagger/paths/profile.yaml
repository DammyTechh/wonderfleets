paths:
  /profile:
    get:
      tags:
      - Profile
      summary: Get my settings
      responses:
        '400': &id001
          $ref: ./../components/responses.yaml#/components/responses/BadRequest
        '401': &id002
          $ref: ./../components/responses.yaml#/components/responses/Unauthorized
        '403': &id003
          $ref: ./../components/responses.yaml#/components/responses/Forbidden
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/AdminProfile
      operationId: getProfile
    put:
      tags:
      - Profile
      summary: Update my settings
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/AdminProfile
        '409':
          $ref: ./../components/responses.yaml#/components/responses/Conflict
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/UpdateProfileRequest
  /profile/password:
    post:
      tags:
      - Profile
      summary: Change my password
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '422':
          $ref: ./../components/responses.yaml#/components/responses/UnprocessableEntity
        '429':
          $ref: ./../components/responses.yaml#/components/responses/TooManyRequests
      operationId: changePassword
      description: Signs out every other session by rotating the security stamp, and sends a confirmation email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./../components/schemas.yaml#/components/schemas/ChangePasswordRequest
  /profile/photo:
    post:
      tags:
      - Profile
      summary: Upload my photo
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/AdminProfile
      operationId: uploadProfilePhoto
      description: PNG or JPG, maximum 2 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
