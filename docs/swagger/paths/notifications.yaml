paths:
  /notifications:
    get:
      tags:
      - Notifications
      summary: Notification feed
      responses:
        '400': &id001
          $ref: ./../components/responses.yaml#/components/responses/BadRequest
        '401': &id002
          $ref: ./../components/responses.yaml#/components/responses/Unauthorized
        '403': &id003
          $ref: ./../components/responses.yaml#/components/responses/Forbidden
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/PagedNotifications
      operationId: listNotifications
      description: Grouped as Today, Yesterday, Earlier this week and Older.
      parameters:
      - $ref: ./../components/responses.yaml#/components/parameters/page
      - $ref: ./../components/responses.yaml#/components/parameters/pageSize
      - $ref: ./../components/responses.yaml#/components/parameters/search
      - name: category
        in: query
        schema:
          type: string
          enum:
          - Hardware
          - Critical
          - Partner
          - System
      - name: unreadOnly
        in: query
        schema:
          type: boolean
  /notifications/unread-count:
    get:
      tags:
      - Notifications
      summary: Unread count
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/UnreadCount
      operationId: unreadNotifications
  /notifications/read-all:
    post:
      tags:
      - Notifications
      summary: Mark all as read
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./../components/schemas.yaml#/components/schemas/UnreadCount
      operationId: markAllRead
  /notifications/{id}/read:
    post:
      tags:
      - Notifications
      summary: Mark one as read
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: markRead
      parameters: &id004
      - $ref: ./../components/responses.yaml#/components/parameters/id
  /notifications/{id}/dismiss:
    post:
      tags:
      - Notifications
      summary: Dismiss
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '204':
          $ref: ./../components/responses.yaml#/components/responses/NoContent
        '404':
          $ref: ./../components/responses.yaml#/components/responses/NotFound
      operationId: dismissNotification
      parameters: *id004
