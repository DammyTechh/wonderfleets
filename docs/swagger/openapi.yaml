components:
  securitySchemes:
    bearerAdmin:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Administrator access token from `POST /api/v1/auth/login` (15 minutes).
    bearerPortal:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Portal token from `POST /api/v1/portal/session` (share link, no sign-in).
