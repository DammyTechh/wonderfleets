openapi: 3.0.3
info:
  title: WonderFleet API
  version: "1.0.0"
  summary: AI-enabled, heat-aware monitoring for agricultural produce in transit.
  description: |
    WonderFleet is the monitoring platform of **Ofemini Global Limited (OfeminiAgricTech)**.
    It tracks temperature, humidity and position of produce in transit, raises heat-spoilage alerts,
    notifies stakeholders by email and SMS, and produces compliance and emission reports.

    ## Interfaces
    The API serves three interfaces:

    | Interface | Audience | Authentication |
    |---|---|---|
    | Admin console | WonderFleet administrators | `bearerAdmin` (email + password sign-in; there is **no** registration endpoint) |
    | Logistics partner portal | Transporters | `bearerPortal` (share link, **no sign-in**) |
    | Agro-processor portal | Produce owners | `bearerPortal` (share link, **no sign-in**) |

    ## Share links
    An administrator shares a shipment with a partner; WonderFleet generates a **temporary link**
    that needs no account. `POST /api/v1/portal/session` exchanges the link token for a short-lived
    portal token. A link stops working as soon as its trips end, when it expires, or when it is revoked.
    The two audiences receive **different dashboards**: transporters see fleet and position data,
    produce owners see the condition of their cargo.

    ## Errors
    All errors are RFC 7807 problem documents with a stable machine-readable `code`.

    ## Real time
    A SignalR hub at `/hubs/fleet` pushes `telemetry`, `alert` and `notification` events.
    Pass the access token as `?access_token=` on the WebSocket handshake.
  contact:
    name: OfeminiAgricTech
    email: ofeminiagrictech@gmail.com
  license:
    name: Proprietary — Ofemini Global Limited

servers:
  - url: https://wonderfleet-api.onrender.com
    description: Production (Render)
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Authentication
    description: Administrator sign-in. Admin accounts are seeded, never self-registered.
  - name: Profile
    description: The signed-in administrator's own settings.
  - name: Dashboard
    description: Operational overview (active trips, alerts, climate, emissions, Route AI).
  - name: Fleet management
    description: Vehicles and the "Add a Fleet" wizard.
  - name: Shipments
    description: Trip lifecycle - schedule, start, complete, cancel, reassign.
  - name: Live tracking
    description: Map markers, GPS and time monitor, device sensor summary.
  - name: Logistics partners
    description: Transporters, their fleets, corridors and compliance documents.
  - name: Agro-processors
    description: Produce owners and their contact persons.
  - name: Drivers
    description: Driver pool and assignment.
  - name: Devices
    description: Master and sub-unit sensor devices and their Firebase keys.
  - name: Produce
    description: Produce types and their default safe ranges.
  - name: Alerts
    description: Heat and route alerts, alert rules, notification channels.
  - name: Notifications
    description: In-app notification feed.
  - name: Analytics
    description: Uptime, compliance, spoilage, weather intelligence.
  - name: Fuel planning
    description: How much fuel to send with a truck, and what it actually used.
  - name: Status reports
    description: Downloadable PDF and CSV reports.
  - name: WonderFleet Route AI
    description: Heat-aware route ranking and departure advice.
  - name: Geo and weather
    description: Geocoding, place autocomplete and forecasts.
  - name: Partner access
    description: Generation and revocation of login-free tracking links.
  - name: Partner portal
    description: The two login-free dashboards.
  - name: Telemetry
    description: Optional signed webhook for device push.
  - name: Media
    description: Signed, expiring URLs for stored images and documents.

security:
  - bearerAdmin: []

