# Render blueprint for WonderFleet (Ofemini Global Limited).
#
# Render only reads this file from the REPOSITORY ROOT, which is why it lives here
# rather than in deploy/ alongside the Dockerfile.
#
# It creates three things: the API (Docker), a PostgreSQL database, and the admin app
# (static). Values marked `sync: false` are typed once in the Render dashboard and are
# never committed. Service URLs are wired between services rather than hardcoded, so
# CORS and the API base URL stay correct.
#
# Custom domains: the admin app is wonderfleet.org and the API is api.wonderfleet.org.
# Render also adds www.wonderfleet.org automatically, redirecting it to the root.
services:
  - type: web
    name: wonderfleet-api
    runtime: docker
    plan: starter
    region: frankfurt
    # Paths are relative to the repository root. The build context must be the root
    # because the image also copies docs/swagger, which lives outside backend/.
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    domains:
      - api.wonderfleet.org
    disk:
      # Uploaded partner documents and generated reports. Without this they would be
      # lost on every deploy, because a container's own filesystem is temporary.
      name: wonderfleet-uploads
      mountPath: /var/data/wonderfleet
      sizeGB: 1
    envVars:
      # The Dockerfile makes Kestrel listen on 8080; tell Render so it routes to it
      # rather than guessing.
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        fromDatabase:
          name: wonderfleet-db
          property: connectionString
      - key: Database__SslMode
        value: Require
      - key: Storage__RootPath
        value: /var/data/wonderfleet
      # The custom domains, not the onrender.com ones: these appear in share links,
      # password-reset emails and signed media URLs, so they must be what people see.
      - key: App__PublicApiBaseUrl
        value: https://api.wonderfleet.org
      - key: App__FrontendBaseUrl
        value: https://wonderfleet.org
      # Origins the browser may call the API from. The browser sends the origin it is
      # actually on, so every hostname that can serve the app needs to be listed:
      # the root, the www redirect, and the onrender.com address while DNS propagates.
      - key: App__AllowedOrigins__0
        value: https://wonderfleet.org
      - key: App__AllowedOrigins__1
        value: https://www.wonderfleet.org
      - key: App__AllowedOrigins__2
        fromService:
          type: web
          name: wonderfleet-web
          envVarKey: RENDER_EXTERNAL_URL

      # --- secrets ----------------------------------------------------------
      # Generated once by Render and then kept. Tokens issued before a change stop
      # working, so do not regenerate these casually.
      - key: Jwt__AdminSigningKey
        generateValue: true
      - key: Jwt__PortalSigningKey
        generateValue: true
      - key: Security__TokenHashKey
        generateValue: true
      - key: Security__MediaSigningKey
        generateValue: true
      # The first administrator's password. Set it in the dashboard before the first
      # deploy; you are asked to change it at first sign-in.
      - key: Seed__AdminPassword
        sync: false

      # --- hardware feed ----------------------------------------------------
      - key: Firebase__DatabaseUrl
        value: https://wonderfleets-bb040-default-rtdb.firebaseio.com
      # The service account key, base64 encoded. Required here: open database rules
      # are never acceptable on a public deployment.
      #
      # A key belongs to ONE Firebase project. The database above moved to the
      # `wonderfleets` project, so a key downloaded from the old project is rejected
      # with 401/403 — download a fresh key from the project that owns this database.
      - key: Firebase__ServiceAccountJson
        sync: false
      - key: Firebase__AllowUnauthenticated
        value: "false"
      - key: Telemetry__PollingEnabled
        value: "true"
      - key: Telemetry__WebhookSecret
        sync: false

      # --- optional integrations -------------------------------------------
      # Leave any of these blank: weather falls back to keyless Open-Meteo, routing to
      # a transparent heuristic, and email and SMS are written to the log instead of sent.
      - key: Google__ApiKey
        sync: false
      - key: OpenAi__ApiKey
        sync: false
      - key: Email__Provider
        value: ResendApi
      - key: Email__ApiKey
        sync: false
      - key: Email__From
        value: WonderFleet <alerts@ofeminiagrictech.com>
      - key: Sms__Provider
        value: Twilio
      - key: Sms__Twilio__AccountSid
        sync: false
      - key: Sms__Twilio__AuthToken
        sync: false
      # The sender shown on the recipient's phone. Nigerian networks do NOT deliver
      # from Twilio long codes, so for Nigerian recipients this must be a
      # pre-registered alphanumeric sender ID (for example WonderFleet), not a +234
      # number. Registration takes about three weeks; see the setup guide.
      # Alternatively leave this blank and set MessagingServiceSid. With neither,
      # Twilio rejects the send.
      - key: Sms__Twilio__FromNumber
        sync: false
      - key: Sms__Twilio__MessagingServiceSid
        sync: false

  - type: web
    name: wonderfleet-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    domains:
      - wonderfleet.org
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Baked into the built files, so it must be the public API hostname.
      - key: VITE_API_BASE_URL
        value: https://api.wonderfleet.org
    routes:
      # Single-page app: every path is served by index.html so a deep link such as
      # /devices works on a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  - name: wonderfleet-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
